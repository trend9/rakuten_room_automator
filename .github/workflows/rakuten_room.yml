name: 楽天ROOM 完全自動アフィリエイトシステム

on:
  schedule:
    # ⏰ 1日10回：アクティブ時間帯（日本時間 08:00 〜 22:00）に約1.5時間おきに自動投稿
    - cron: '0 23 * * *'  # 日本時間 08:00 (前日 23:00 UTC) -> 自動投稿
    - cron: '30 0 * * *'  # 日本時間 09:30 (00:30 UTC) -> 自動投稿
    - cron: '0 2 * * *'   # 日本時間 11:00 (02:00 UTC) -> 自動投稿
    - cron: '30 3 * * *'  # 日本時間 12:30 (03:30 UTC) -> 自動投稿
    - cron: '0 5 * * *'   # 日本時間 14:00 (05:00 UTC) -> 自動投稿
    - cron: '30 6 * * *'  # 日本時間 15:30 (06:30 UTC) -> 自動投稿
    - cron: '0 8 * * *'   # 日本時間 17:00 (08:00 UTC) -> 自動投稿
    - cron: '30 9 * * *'  # 日本時間 18:30 (09:30 UTC) -> 自動投稿
    - cron: '0 11 * * *'  # 日本時間 20:00 (11:00 UTC) -> 自動投稿
    - cron: '0 13 * * *'  # 日本時間 22:00 (13:00 UTC) -> 自動投稿
    
    # ⏰ 1日1回：早朝にその日の売れ筋トレンド商品を10件自動リサーチしてキューを補充
    - cron: '0 21 * * *'  # 日本時間 06:00 (前日 21:00 UTC) -> 自動トレンドリサーチ

  workflow_dispatch: # 手動で即座に実行したい場合

jobs:
  run-automator:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 履歴(queue.json)を自動コミットしてリポジトリに保存

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 💡 画面非搭載のLinuxサーバー上に「仮想ディスプレイ (Xvfb)」と「本物Google Chrome」を自動インストール
      - name: 📺 仮想ディスプレイ(Xvfb)および依存パッケージのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Playwrightブラウザのインストール
        run: npx playwright install chromium

      - name: 🔐 ログイン認証セッションの復元
        run: |
          mkdir -p storage
          echo '${{ secrets.RAKUTEN_STATE_JSON }}' > storage/state.json
        env:
          RAKUTEN_STATE_JSON: ${{ secrets.RAKUTEN_STATE_JSON }}

      # 💡 仮想画面 Xvfb を通すことで、クラウド上でも「 headless: false 」（有頭ブラウザ）を完全稼働させます！
      - name: 🔍 トレンド商品の自動リサーチ（1日1回早朝のみ）
        if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run research

      # 💡 同様に自動投稿も Xvfb を通して完全有頭偽装で実行！
      - name: 🚀 自動コレ！投稿（1日10回定期実行）
        if: github.event.schedule != '0 21 * * *' || github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run collect

      - name: 💾 投稿履歴とキューリストの自動コミット・保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/queue.json
          git commit -m "💾 投稿履歴とキューを自動更新 [skip ci]" || echo "変更なし"
          git push
