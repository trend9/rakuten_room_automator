name: 楽天ROOM 完全自動アフィリエイトシステム

on:
  schedule:
    # 毎30分に自動実行（1日48回・混雑回避のため15分/45分に調整）
    - cron: '15,45 * * * *'

  workflow_dispatch: # 手動実行用トリガー

env:
  GITHUB_ACTIONS: 'true'
  # 楽天APIキー（必須）— シークレットから渡す
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  # GitHub Token（LLM文章生成 GitHub Models用）
  GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}

jobs:
  run-automator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      models: read

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: 🔐 ログイン認証セッションの復元
        run: |
          mkdir -p storage
          # シークレットがプレーンなJSONかBase64エンコード済みかを自動判定して復元
          FIRST_CHAR=$(echo "${{ secrets.RAKUTEN_STATE_JSON }}" | tr -d '[:space:]' | head -c 1)
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" > storage/state.json
            echo "✅ セッションファイルをプレーンJSON形式から復元しました"
          else
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" | base64 -d > storage/state.json
            echo "✅ セッションファイルをBase64デコードして復元しました"
          fi
          if [ ! -s storage/state.json ]; then
            echo "❌ state.json の復元に失敗しました。Secretが未設定か破損しています。"
            exit 1
          fi
          echo "📊 復元サイズ: ($(wc -c < storage/state.json) bytes)"

      - name: 🔄 キュー前処理（history同期・failed→pending復活）
        run: node src/sync.js || echo "⚠️ 前処理でエラーが発生しましたが、続行します"

      - name: 🔍 トレンド商品の自動リサーチ（楽天API優先）
        run: node src/research.js || echo "⚠️ リサーチでエラーが発生しましたが、続行します"
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}

      - name: 🚀 自動コレ！投稿（最大5件連続）
        run: node src/collect.js
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: 💖 自動いいね巡回
        run: node src/engage.js || echo "⚠️ いいね巡回でエラーが発生しましたが、続行します"

      - name: 💬 自動コメント送信巡回
        run: |
          if [ ! -f storage/comment_state.json ]; then
            echo '{"lastCommentType": 0, "sentUsers": []}' > storage/comment_state.json
          fi
          node src/comment.js || echo "⚠️ コメント巡回でエラーが発生しましたが、続行します"

      - name: 💾 投稿履歴とキューリストの自動コミット・保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # コメント状態ファイルが存在する場合は追加
          if [ -f storage/comment_state.json ]; then
            git add storage/queue.json storage/comment_state.json
          else
            git add storage/queue.json
          fi
          
          git diff --cached --quiet || {
            git commit -m "💾 投稿履歴とキューを自動更新 [skip ci]"
            git push
          }
          echo "✅ 履歴保存処理完了"
