name: 楽天ROOM 完全自動アフィリエイトシステム

on:
  schedule:
    # 毎時0分に自動実行（1日24回）
    - cron: '0 * * * *'

  workflow_dispatch: # 手動実行用トリガー

env:
  GITHUB_ACTIONS: 'true'

jobs:
  run-automator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: 🔐 ログイン認証セッションの復元
        run: |
          mkdir -p storage
          # シークレットがプレーンなJSONかBase64エンコード済みかを自動判定して復元
          FIRST_CHAR=$(echo "${{ secrets.RAKUTEN_STATE_JSON }}" | tr -d '[:space:]' | head -c 1)
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" > storage/state.json
            echo "✅ セッションファイルをプレーンJSON形式から復元しました"
          else
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" | base64 -d > storage/state.json
            echo "✅ セッションファイルをBase64デコードして復元しました"
          fi
          if [ ! -s storage/state.json ]; then
            echo "❌ state.json の復元に失敗しました。Secretが未設定か破損しています。"
            exit 1
          fi
          echo "📊 復元サイズ: ($(wc -c < storage/state.json) bytes)"

      - name: 🔄 最新の投稿履歴を自動同期（重複防止）
        run: node src/sync.js || echo "⚠️ 同期処理でエラーが発生しましたが、続行します"

      - name: 🔍 トレンド商品の自動リサーチ（キュー補充）
        run: node src/research.js || echo "⚠️ リサーチでエラーが発生しましたが、続行します"

      - name: 🚀 自動コレ！投稿
        run: node src/collect.js

      - name: 💖 自動いいね・フォロー巡回
        run: node src/engage.js || echo "⚠️ いいね巡回でエラーが発生しましたが、続行します"

      - name: 💾 投稿履歴とキューリストの自動コミット・保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/queue.json
          git diff --cached --quiet || {
            git commit -m "💾 投稿履歴とキューを自動更新 [skip ci]"
            git push
          }
          echo "✅ 履歴保存処理完了"
