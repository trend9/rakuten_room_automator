name: 楽天ROOM 完全自動アフィリエイトシステム

on:
  schedule:
    # 毎30分に自動実行（1日48回）
    - cron: '0,30 * * * *'

  workflow_dispatch: # 手動実行用トリガー

env:
  GITHUB_ACTIONS: 'true'
  COLAB_API_URL: "http://127.0.0.1:8000"

jobs:
  run-automator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-lcm-sd15
          restore-keys: |
            hf-models-

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-gemma2-2b
          restore-keys: |
            ollama-models-

      - name: Install Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate fastapi uvicorn requests pillow pydantic

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama & Local API Server
        run: |
          # Start Ollama
          ollama serve &
          
          # Write local API server script
          cat << 'EOF' > local_api_server.py
          import base64
          import torch
          import requests
          from fastapi import FastAPI, HTTPException
          from pydantic import BaseModel
          from diffusers import DiffusionPipeline, LCMScheduler
          
          app = FastAPI()
          
          print("Loading LCM Stable Diffusion model on CPU...")
          pipe = DiffusionPipeline.from_pretrained("latent-consistency/lcm-sd15", torch_dtype=torch.float32)
          pipe.scheduler = LCMScheduler.from_config(pipe.scheduler.config)
          pipe.to("cpu")
          print("LCM Model loaded successfully.")
          
          class TextRequest(BaseModel):
              system_prompt: str
              user_prompt: str
          
          class ImageRequest(BaseModel):
              prompt: str
              width: int = 512
              height: int = 512
          
          @app.post("/generate/text")
          async def generate_text(req: TextRequest):
              try:
                  url = "http://localhost:11434/api/chat"
                  payload = {
                      "model": "gemma2:2b",
                      "messages": [
                          {"role": "system", "content": req.system_prompt},
                          {"role": "user", "content": req.user_prompt}
                      ],
                      "stream": False
                  }
                  res = requests.post(url, json=payload, timeout=180)
                  if res.status_code == 200:
                      return {"result": res.json().get("message", {}).get("content", "")}
                  raise HTTPException(status_code=500, detail="Ollama returned error")
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))
          
          @app.post("/generate/image")
          async def generate_image(req: ImageRequest):
              try:
                  image = pipe(
                      prompt=req.prompt,
                      num_inference_steps=4,
                      guidance_scale=8.0,
                      width=req.width,
                      height=req.height
                  ).images[0]
                  
                  import io
                  buf = io.BytesIO()
                  image.save(buf, format="JPEG", quality=90)
                  return {"image_base64": base64.b64encode(buf.getvalue()).decode("utf-8")}
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))
          
          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="127.0.0.1", port=8000)
          EOF
          
          # Wait for Ollama to start
          echo "Waiting for Ollama to start..."
          until curl -s http://localhost:11434 > /dev/null; do sleep 1; done
          echo "Ollama is running. Pulling gemma2:2b..."
          ollama pull gemma2:2b
          
          # Start the local API server in the background
          python local_api_server.py &
          echo "Waiting for local API server to start..."
          until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done
          echo "Local API server is ready!"

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: 🔐 ログイン認証セッションの復元
        run: |
          mkdir -p storage
          # シークレットがプレーンなJSONかBase64エンコード済みかを自動判定して復元
          FIRST_CHAR=$(echo "${{ secrets.RAKUTEN_STATE_JSON }}" | tr -d '[:space:]' | head -c 1)
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" > storage/state.json
            echo "✅ セッションファイルをプレーンJSON形式から復元しました"
          else
            echo "${{ secrets.RAKUTEN_STATE_JSON }}" | base64 -d > storage/state.json
            echo "✅ セッションファイルをBase64デコードして復元しました"
          fi
          if [ ! -s storage/state.json ]; then
            echo "❌ state.json の復元に失敗しました。Secretが未設定か破損しています。"
            exit 1
          fi
          echo "📊 復元サイズ: ($(wc -c < storage/state.json) bytes)"

      - name: 🔄 最新の投稿履歴を自動同期（重複防止）
        run: node src/sync.js || echo "⚠️ 同期処理でエラーが発生しましたが、続行します"

      - name: 🔍 トレンド商品の自動リサーチ（キュー補充）
        run: node src/research.js || echo "⚠️ リサーチでエラーが発生しましたが、続行します"

      - name: 🚀 自動コレ！投稿（最大3件連続）
        run: node src/collect.js

      - name: 💖 自動いいね・フォロー巡回
        run: node src/engage.js || echo "⚠️ いいね巡回でエラーが発生しましたが、続行します"

      - name: 💾 投稿履歴とキューリストの自動コミット・保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/queue.json
          git diff --cached --quiet || {
            git commit -m "💾 投稿履歴とキューを自動更新 [skip ci]"
            git push
          }
          echo "✅ 履歴保存処理完了"
